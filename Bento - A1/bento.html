<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bento - A1</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <style>
      :root {
        --blue-deep: #14284a;
        --blue-mid: #274a77;
        --blue-faded: #4a7399;
        --cream: #efe6d2;
        --tile-border: 6px;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        overflow-x: hidden;
        background: radial-gradient(
          ellipse at 30% 20%,
          var(--blue-faded) 0%,
          var(--blue-mid) 45%,
          var(--blue-deep) 100%
        );
        background-attachment: fixed;
      }

    
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 10;
        pointer-events: none;
        opacity: 0.22;
        mix-blend-mode: soft-light;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      }

      /* Soft vignette */
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 9;
        pointer-events: none;
        background: radial-gradient(
          ellipse at center,
          transparent 55%,
          rgba(5, 12, 28, 0.55) 100%
        );
      }

      .tile {
        overflow: hidden;
        background-color: #f1f1f1;
        border: var(--tile-border) solid var(--cream);
        border-radius: 4px;
        box-shadow: 0 8px 18px rgba(5, 12, 28, 0.45);
        transition: transform 0.3s ease;
      }

      .tile img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: saturate(0.9) contrast(1.05) sepia(0.08);
      }

      .tile-square {
        aspect-ratio: 1 / 1;
      }

      .tile-wide {
        aspect-ratio: 4 / 3;
      }

      .tile-banner {
        aspect-ratio: 2 / 1;
      }

      
      @media (hover: hover) {
        .tile:hover {
          transform: rotate(-0.6deg) scale(1.01);
        }
      }

     
      @media (max-width: 767.98px) {
        :root {
          --tile-border: 4px;
        }

        .tile {
          box-shadow: 0 5px 12px rgba(5, 12, 28, 0.4);
        }
      }

      
      @media (max-width: 575.98px) {
        :root {
          --tile-border: 3px;
        }

        .tile {
          border-radius: 3px;
        }

        .tile-banner {
          aspect-ratio: 16 / 9;
        }
      }

      
      @media (min-width: 1800px) {
        .container {
          max-width: 1400px;
        }
      }

      
      @media (prefers-reduced-motion: reduce) {
        .tile {
          transition: none;
        }
      }
    </style>
  </head>

  <body>
    <div class="container py-3 py-md-4">
      <div class="row g-2 g-md-3">

        <div class="col-12 col-md-6">
          <div class="card tile tile-square">
            <img src="img1.jpg" alt="Card 1" loading="lazy" />
          </div>
        </div>

        <div class="col-12 col-md-6">
          <div class="row g-2 g-md-3">
            <div class="col-6">
              <div class="card tile tile-square">
                <img src="img2.jpg" alt="Card 2" loading="lazy" />
              </div>
            </div>
            <div class="col-6">
              <div class="card tile tile-square">
                <img src="img3.jpg" alt="Card 3" loading="lazy" />
              </div>
            </div>
            <div class="col-6">
              <div class="card tile tile-square">
                <img src="img9.jpg" alt="Card 13" loading="lazy" />
              </div>
            </div>
            <div class="col-6">
              <div class="card tile tile-square">
                <img src="img8.jpg" alt="Card 14" loading="lazy" />
              </div>
            </div>
          </div>
        </div>

        
        <div class="col-12 col-md-4">
          <div class="card tile tile-wide">
            <img src="img15.jpg" alt="Card 4" loading="lazy" />
          </div>
        </div>
        <div class="col-6 col-md-4">
          <div class="card tile tile-wide">
            <img src="img14.jfif" alt="Card 5" loading="lazy" />
          </div>
        </div>
        <div class="col-6 col-md-4">
          <div class="card tile tile-wide">
            <img src="img6.jpg" alt="Card 6" loading="lazy" />
          </div>
        </div>

        <!-- Row 3: 2x2 on phones, 4 across on tablets and up -->
        <div class="col-6 col-md-3">
          <div class="card tile tile-square">
            <img src="img12.jfif" alt="Card 7" loading="lazy" />
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="card tile tile-square">
            <img src="img10.jfif" alt="Card 8" loading="lazy" />
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="card tile tile-square">
            <img src="img11.jfif" alt="Card 9" loading="lazy" />
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="card tile tile-square">
            <img src="img13.jfif" alt="Card 10" loading="lazy" />
          </div>
        </div>


        <div class="col-12 col-sm-6">
          <div class="card tile tile-banner">
            <img src="img4.jpg" alt="Card 11" loading="lazy" />
          </div>
        </div>
        <div class="col-12 col-sm-6">
          <div class="card tile tile-banner">
            <img src="img5.jpg" alt="Card 12" loading="lazy" />
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
