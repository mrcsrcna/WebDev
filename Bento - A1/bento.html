<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap Bento Grid</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <style>
      :root {
        --blue-deep: #14284a;
        --blue-mid: #274a77;
        --blue-faded: #4a7399;
        --cream: #efe6d2;
      }

      body {
        min-height: 100vh;
        background:
          radial-gradient(
            ellipse at 30% 20%,
            var(--blue-faded) 0%,
            var(--blue-mid) 45%,
            var(--blue-deep) 100%
          )
          fixed;
      }

      /* Film grain overlay */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 10;
        pointer-events: none;
        opacity: 0.22;
        mix-blend-mode: soft-light;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      }

      /* Soft vignette */
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 9;
        pointer-events: none;
        background: radial-gradient(
          ellipse at center,
          transparent 55%,
          rgba(5, 12, 28, 0.55) 100%
        );
      }

      .tile {
        overflow: hidden;
        background-color: #f1f1f1;
        border: 6px solid var(--cream);
        border-radius: 4px;
        box-shadow: 0 8px 18px rgba(5, 12, 28, 0.45);
        transition: transform 0.3s ease;
      }

      .tile:hover {
        transform: rotate(-0.6deg) scale(1.01);
      }

      .tile img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: saturate(0.9) contrast(1.05) sepia(0.08);
      }

      .tile-square {
        aspect-ratio: 1 / 1;
      }

      .tile-wide {
        aspect-ratio: 4 / 3;
      }

      .tile-banner {
        aspect-ratio: 2 / 1;
      }
    </style>
  </head>

  </head>

  <body>
    <div class="container my-3">
      <div class="row g-3">

          <div class="card tile tile-square">

          </div>
        </div>

        <div class="col-6">

              </div>
            </div>
            <div class="col-6">
              <div class="card tile tile-square">
                <img src="img3.jpg" alt="Card 3" />
              </div>
            </div>
            <div class="col-6">
              <div class="card tile tile-square">
                <img src="img9.jpg" alt="Card 13" />
              </div>
            </div>
            <div class="col-6">
              <div class="card tile tile-square">

              </div>
            </div>
          </div>
        </div>

        <div class="col-4">
          <div class="card tile tile-wide">
            <img src="img15.jpg" alt="Card 4" />
          </div>
        </div>
        <div class="col-4">
          <div class="card tile tile-wide">
            <img src="img14.jfif" alt="Card 5" />
          </div>
        </div>
        <div class="col-4">
          <div class="card tile tile-wide">
            <img src="img6.jpg" alt="Card 6" />
          </div>
        </div>

  
        <div class="col-3">
          <div class="card tile tile-square">
            <img src="img12.jfif" alt="Card 7" />
          </div>
        </div>
        <div class="col-3">
          <div class="card tile tile-square">
            <img src="img10.jfif" alt="Card 8" />
          </div>
        </div>
        <div class="col-3">
          <div class="card tile tile-square">
            <img src="img11.jfif" alt="Card 9" />
          </div>
        </div>
        <div class="col-3">
          <div class="card tile tile-square">
            <img src="img13.jfif" alt="Card 10" />

        </div>


        <div class="col-6">

    <script

    ></script>
  </body>
</html>
